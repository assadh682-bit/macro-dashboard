<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>البيانات الأساسية</title>
<style>
:root{--bg:#000;--p:#0c0c0c;--ln:#2a2a2a;--tx:#e8e2d4;--mu:#8a8578;--am:#ffa028;--up:#19c37d;--dn:#ff4d4f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.7 system-ui,sans-serif}
header{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 14px;border-bottom:2px solid var(--am)}
h1{margin:0;font-size:18px;color:var(--am)}
h2{margin:0 0 8px;font-size:15px;color:var(--am)}
a{color:var(--am)}
.tag{font-size:12px;color:var(--mu)}
main{display:grid;gap:12px;padding:12px;max-width:900px;margin:auto}
section{background:var(--p);border:1px solid var(--ln);padding:12px}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--ln);font-size:14px}
.ltr{direction:ltr;unicode-bidi:isolate;font-family:ui-monospace,monospace}
.up{color:var(--up)}.dn{color:var(--dn)}
</style>
</head>
<body>
<header><h1>البيانات الأساسية</h1><a href="index.html">الرجوع للدشبورد</a></header>
<main>
<section><h2>تقرير COT: مراكز Managed Money</h2><div id="cot"></div>
<p class="tag">Net = Long ناقص Short. الأرقام أسبوعية (كتصدر الجمعة)، وكتعكس مراكز الصناديق وماشي توقع.</p></section>
<section><h2>مزادات الخزينة الأمريكية القادمة</h2><div id="auc"></div></section>
<p class="tag" id="upd"></p>
</main>
<script>
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function row(a,b,cls){var r=el("div","row");r.appendChild(el("span","",a));r.appendChild(el("span","ltr "+(cls||""),b));return r}
function fmt(n){return Number(n).toLocaleString("en-US")}
fetch("data.json?t="+Date.now()).then(function(r){return r.json()}).then(function(d){
  var c=document.getElementById("cot"),a=document.getElementById("auc");
  if(d.cot&&Object.keys(d.cot).length){
    Object.keys(d.cot).forEach(function(k){
      var x=d.cot[k];
      c.appendChild(row(k+" ("+x.date+")","Long "+fmt(x.long)+" / Short "+fmt(x.short)));
      c.appendChild(row("Net",fmt(x.net)+(x.change===null?"":" ("+(x.change>0?"+":"")+fmt(x.change)+")"),x.change>0?"up":x.change<0?"dn":""));
    });
  }else c.appendChild(el("p","tag","ما قدرتش نجيب بيانات COT دابا."));
  if(d.auctions&&d.auctions.length){
    d.auctions.forEach(function(x){
      var amt=parseFloat(x.amount);
      a.appendChild(row(x.date+" \u00b7 "+x.type,(x.term||"")+(isNaN(amt)?"":" \u00b7 $"+(amt/1e9).toFixed(1)+"B")));
    });
  }else a.appendChild(el("p","tag","ما قدرتش نجيب المزادات دابا."));
  document.getElementById("upd").textContent="آخر تحديث: "+d.updated+" (توقيت المغرب)";
}).catch(function(){
  document.getElementById("cot").appendChild(el("p","tag","البيانات ما واجداش بعد. شغل workflow ديال data الأول."));
});
</script>
</body>
</html>
